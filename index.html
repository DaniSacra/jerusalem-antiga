<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="theme-color" content="#6b5236" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Jerusalém" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Jerusalém Antiga</title>
    <style>
      html, body { margin: 0; height: 100%; background: #6b5236; overflow: hidden; touch-action: none; }
      #rotate {
        display: none; position: fixed; inset: 0; z-index: 10; background: #6b5236; color: #f3e6c8;
        font: 600 20px 'Trebuchet MS', Verdana, sans-serif; align-items: center; justify-content: center; text-align: center; padding: 24px;
      }
      @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
    </style>
  </head>
  <body>
    <div id="rotate">Gire o celular para a posição deitada para jogar.</div>
    <script type="module" src="/src/app/main.ts"></script>
  </body>
</html>
